[package]
name = "piikey-app"
description = "Windows app that finds and flags personal data as you type, maps it across your files and masks it before it leaves your PC"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[[bin]]
name = "piikey"
path = "src/main.rs"

[dependencies]
piikey = { path = ".." }
# MITM HTTP/S + WebSocket proxy.
hudsucker = { version = "0.25.0", default-features = false, features = [
    "rcgen-ca",
    "rustls-client",
    "decoder",
    "http2",
] }
tokio = { workspace = true, features = ["rt-multi-thread"] }
# WinINET system proxy on/off.
sysproxy = "0.3.0"
# Client port -> PID, PID -> exe name (per-program rules).
netstat2 = "0.11.2"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
# The decrypted CA private key is wiped on drop.
zeroize.workspace = true
# Native WinUI 3 UI. Pinned to windows-rs master: the tray / multi-window
# Application API is not in a crates.io release yet (0.100.0 lacks it).
# The `test` feature is for `subscribe_live_interval`, the only way to a timer on the application
# thread while no window is open (`ui/mod.rs`, `Ticker`): `Application` has no cross-thread
# handle and no timer, and the reactor's own dispatcher is private. The feature only adds test
# hooks next to it (a recording adapter, more event payloads); the real adapter is unchanged.
# From the fork TBLgGamin/windows-rs: microsoft/windows-rs at 20f6de7 plus one fix (closing a
# window with a dialog open panicked in the adapter's drop and aborted the process). Back to
# microsoft/windows-rs once it has the fix.
windows-reactor = { git = "https://github.com/TBLgGamin/windows-rs", rev = "5fe8f5decadf4f64bcad485005d47769e9067b5a", features = ["test"] }
serde_json.workspace = true
# Reads the Windows light/dark app setting (HKCU Personalize) with a safe registry API.
winreg = "0.56.0"
# The Store build's startup task and how it was started (`startup.rs`), through WinRT's safe
# bindings; the root crate already builds this version.
windows = { version = "0.62.2", features = ["ApplicationModel", "ApplicationModel_Activation", "Foundation"] }
# Reads the focused text field of protected sites (what the user types) through Windows UI
# Automation, behind a safe wrapper: raw `windows` UIA calls are `unsafe` and `unsafe` is forbidden.
# Uses windows 0.62.2, the version the root crate already builds.
# Default features: the crate does not build with fewer (its feature gates are incomplete).
# `event` (no extra crate) compiles the safe event-handler registration: PowerPoint shows its slide
# area to a UI Automation client only once that client has registered a handler.
uiautomation = { version = "0.25.1", features = ["event"] }
# What the user pastes: clipboard sequence number and text, safe API, no other dependencies.
clipboard-win = "5.4.1"
# Finds the captured values in outgoing requests; already built for the root crate.
aho-corasick.workspace = true
# The live highlight (`highlight.rs`): an outline of four topmost, click-through windows around the
# field in focus. windows-reactor has no such window and the raw Win32 calls are `unsafe`, which is
# forbidden here, so winit makes the windows, softbuffer fills them and global-hotkey registers
# Ctrl+Alt+P. Windows only: no X11 or Wayland features.
winit = { version = "0.30.13", default-features = false, features = ["rwh_06"] }
softbuffer = { version = "0.4.8", default-features = false }
global-hotkey = "0.7.0"
# Scans of files run on a pool of half the cores (`ui/controller/inventory.rs`), so the PC stays responsive;
# the root crate already depends on it.
rayon.workspace = true
# The watch (`ui/watcher.rs`): file-system change notifications for the folders the user asks to be
# watched, so a change is scanned when it happens and nothing polls. The Windows call behind it
# (`ReadDirectoryChangesW`) is `unsafe` to make and `unsafe` is forbidden here, so a crate wraps it.
# `default-features = false` leaves out the macOS backend; on Windows it adds `notify-types` and a
# newer `windows-sys`, and uses `walkdir` and `log` as the rest of the build does.
notify = { version = "8.2.0", default-features = false }
# The Browse buttons of Inventory and Watch: the Windows folder and file pickers. The reactor has no
# picker, and the shell's `IFileOpenDialog` is COM, `unsafe` to call, so a crate wraps it.
rfd = { version = "0.17.2", default-features = false }

[build-dependencies]
# Embeds assets/piikey.ico as the exe icon resource (icon only: the manifest comes from windows-reactor-setup).
embed-resource.workspace = true
# Stages a private Windows App SDK runtime so no runtime install is needed.
windows-reactor-setup = { git = "https://github.com/TBLgGamin/windows-rs", rev = "5fe8f5decadf4f64bcad485005d47769e9067b5a" }

[lints]
workspace = true
