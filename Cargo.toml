[workspace]
members = [".", "app"]
# `cargo build` / `cargo test` cover the app too (hooks and CI run them without `--workspace`).
default-members = [".", "app"]

# The one place the version lives: release-plz bumps it, nothing else may (scripts/release-guard.mjs).
[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
authors = ["TBLgGamin"]
repository = "https://github.com/TBLgGamin/piikey"
homepage = "https://github.com/TBLgGamin/piikey"
keywords = ["pii", "privacy", "dlp", "gdpr", "anonymization"]
categories = ["text-processing", "command-line-utilities"]
publish = false

# Dependencies both packages use: one version and one feature set, so they never drift apart.
[workspace.dependencies]
rayon = "1.12.0"
# Wipes key material from memory on drop (vault master key, the app's CA key).
zeroize = "1.9.1"
# Safe DPAPI wrapper: the vault master key and the app's CA key are bound to the Windows user.
windows-dpapi = "0.2.0"
# Named-pipe server and client, the HTTP API's event loop and its shutdown signal (`sync`, `time`);
# the app adds `rt-multi-thread` for the proxy.
tokio = { version = "1.53.3", default-features = false, features = [
    "rt",
    "net",
    "io-util",
    "sync",
    "time",
    "macros",
] }
# Known-name detection, tolerant restore and the app's typed-value search: multi-pattern exact matching.
aho-corasick = "1.1.5"
# JSON for the API, the vault export and the settings patch. `preserve_order` keeps the fields of an
# API reply in the order the docs list them; `float_roundtrip` keeps numbers exact through the proxy.
serde_json = { version = "1.0.154", features = ["preserve_order", "float_roundtrip"] }
# Embeds app/assets/piikey.ico as the exe icon resource (rc.exe or llvm-rc from the Windows SDK):
# it finds the SDK tools itself and adds no manifest of its own.
embed-resource = "3.0.12"

[package]
name = "piikey"
description = "Local PII manager for Windows: finds, flags and masks personal data in what you type, send and store; validated regexes plus an on-device model, encrypted vault, JSON API and CLI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[[bin]]
name = "piikey-cli"
path = "src/main.rs"

[dependencies]
# Multi-pattern lazy-DFA scan; Unicode tables off (all patterns are ASCII).
regex-automata = { version = "0.4.18", default-features = false, features = [
    "std",
    "syntax",
    "perf",
    "meta",
    "nfa-pikevm",
    "nfa-backtrack",
    "hybrid",
    "dfa-onepass",
] }
rayon.workspace = true
# Keyed hash: proxy derivation, watermark, key derivation.
blake3 = "1.8.7"
# Vault record encryption (XChaCha20-Poly1305; fast without AES-NI).
chacha20poly1305 = { version = "0.11.0", features = ["zeroize"] }
getrandom = "0.4.3"
zeroize.workspace = true
windows-dpapi.workspace = true
# WinRT OCR + PDF rendering, and whether the process runs from an MSIX package (`sys::is_packaged`),
# all shipped with Windows.
windows = { version = "0.62.2", features = [
    "ApplicationModel",
    "Media_Ocr",
    "Graphics_Imaging",
    "Storage_Streams",
    "Data_Pdf",
    "Foundation",
    "Foundation_Collections",
    "Globalization",
] }
tokio.workspace = true
# The local HTTP API (`api/http.rs`): HTTP/1 on loopback. Already in the build graph through the
# proxy stack (hudsucker), so they add no new crate.
hyper = { version = "1.12.0", default-features = false, features = ["server", "http1"] }
hyper-util = { version = "0.1.21", default-features = false, features = ["tokio"] }
http-body-util = "0.1.5"
# Document formats.
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
quick-xml = "0.42.0"
lopdf = "0.45.0"
mail-parser = "0.11.9"
cfb = "0.15.0"
lexopt = "0.3.2"
aho-corasick.workspace = true
# Tolerant restore: edit distance for typo'd proxies.
strsim = "0.11.1"
# On-device PII model runtime: ONNX Runtime with the DirectML GPU backend (CPU fallback) behind safe
# wrappers, so our own code stays free of `unsafe`. The prebuilt runtime is linked statically;
# `copy-dylibs` places DirectML.dll next to the executables.
ort = { version = "=2.0.0-rc.15", default-features = false, features = [
    "std",
    "api-31",
    "download-binaries",
    "copy-dylibs",
    "tls-native",
    "directml",
] }
# Loads the model's tokenizer.json (byte-fallback BPE). `fancy-regex` is pure Rust: no C/C++ build.
tokenizers = { version = "0.23.2", default-features = false, features = ["fancy-regex"] }
# Already in the build graph through `tokenizers` and the proxy stack, so they add no new crate.
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
# JSON Schema of the API types, for the generated OpenAPI reference (`api::openapi`, `docs/api`).
# `derive` is the `JsonSchema` derive, `std` the impls for `PathBuf`, and `preserve_order` keeps the
# fields of a schema in the order of the struct, the order the docs list them in.
schemars = { version = "1.2.3", default-features = false, features = [
    "derive",
    "std",
    "preserve_order",
] }
# Reads `docs/api/prose.toml`, the hand-written text of the API reference, with the position of each
# `reviewed` fingerprint in it (`toml::Spanned`), so `cargo api-docs --accept` changes nothing else.
# Already in the lockfile through embed-resource's build script, so no new crate is fetched; only
# the parser and serde support are on.
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde", "std"] }
# Cloud accounts (`sources/`): blocking HTTPS to the providers' REST APIs. Already in the build graph
# (ort-sys's build script downloads the runtime with it), so it adds no new crate. `native-tls` is
# Windows' own TLS stack (SChannel): it trusts the Windows certificate store, so a company's TLS
# inspection root works too. Only TLS is on: JSON, form bodies and redirects need no feature.
ureq = { version = "3.4.2", default-features = false, features = ["native-tls"] }
# RS256 signing of the JWT assertions (Microsoft client certificates, Google service accounts),
# SHA-256 of the PKCE challenge and SHA-1 of a certificate's thumbprint. Already in the build graph
# through the app's certificate generation (rcgen), so no new crate.
ring = "0.17.14"
# base64url of those JWTs and the base64 of PEM files. Already in the build graph through ureq.
base64 = { version = "0.23.1", default-features = false, features = ["std"] }

[build-dependencies]
embed-resource.workspace = true

[lints]
workspace = true

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# Disk: debug info of dependencies is most of target\debug (PDBs of several GB) and is never
# stepped into; piikey's own crates keep full debug info. Line tables still give backtraces.
[profile.dev.package."*"]
debug = "line-tables-only"

# uiautomation 0.25.1 plus one safe method, `UITextRange::get_bounding_rectangles`: the exact
# rectangle of each line of a text range (the call behind it is `unsafe`, so it must come from the
# wrapper). The highlight outline and "Open at this place" box the text with it. Drop this once
# a release of uiautomation has the method.
[patch.crates-io]
uiautomation = { git = "https://github.com/TBLgGamin/uiautomation-rs", rev = "95863e59cd284b0218d4a3756162e3be023ec610" }
