# cargo-about: THIRD_PARTY_LICENSES.html in every release (packaging/windows/package.ps1, template
# packaging/windows/about.hbs). Same list as the `allow` list of deny.toml: change both together.
accepted = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "BSL-1.0",
  "CC0-1.0",
  "MPL-2.0",
  "CDLA-Permissive-2.0",
  "0BSD",
  "Unlicense",
]
targets = ["x86_64-pc-windows-msvc"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
