# Label mapping for the piikey quality benchmark (eval/README.md).
#
# One coarse taxonomy ties together three things that do not share a vocabulary: the labels of
# each ground-truth corpus, the labels of the hand-made set, and piikey's 44 `EntityKind`s.
#
# Read by eval/fetch.py and eval/handmade.py (Python `tomllib`) and by the Rust benchmark
# (`examples/pii_eval`, a hand-written reader for exactly this subset of TOML: `[section]`
# headers, `KEY = "string"` lines, `#` comments; nothing else).

# --- The coarse taxonomy -------------------------------------------------------------------------
[categories]
PERSON = "Names of people: full, first, last, aliases"
PERSON_ATTR = "Descriptive facts about a person: age, gender, honorific, job role"
EMAIL = "Email addresses"
PHONE = "Phone numbers"
ADDRESS = "Street or postal addresses, and their parts (street, number, postcode)"
LOCATION = "Cities, states, countries and other place names"
GEO = "Geographic coordinates"
ORG = "Names of companies and other organizations"
DATE = "Dates and times in general (not a birth date)"
DOB = "Dates of birth"
ID_NUMBER = "Identifiers issued by an authority or institution: SSN, BSN, passport, licence, tax, medical record, plate, VIN"
ACCOUNT = "Identity inside a service: usernames, handles, customer / employee / account ids"
FINANCIAL = "Bank and card data: IBAN, bank account, routing number, BIC, card number, CVV"
AMOUNT = "Amounts of money"
NETWORK = "IP and MAC addresses, URLs, device identifiers"
SECRET = "Passwords, PINs, API keys, tokens, URL credentials"
SENSITIVE = "GDPR special categories: health, biometric, ethnic origin, politics, religion, orientation, union, criminal"
OTHER = "Anything else the model can tag: brand and product names, document and case references"

# --- How the benchmark treats each source ---------------------------------------------------------
# "exhaustive": every PII value of the text is labelled, so a prediction that matches no label is
#               a false positive (the hand-made set).
# "partial":    the source labels only the categories of its own label vocabulary below. A
#               prediction of another category cannot be judged and is reported as unjudged. This is
#               the default.
[policy]
handmade = "exhaustive"
finance_multilingual = "partial"
openpii = "partial"
gretel_en = "partial"

# --- Categories whose neighbours are the same thing to a different annotator ---------------------
# The overlap-and-category metric accepts either side of a pair. The strict metric never does.
# OpenPII calls the city of an address CITY while the model folds it into POSTAL_ADDRESS; OpenPII
# calls every date DATE while the model can tell a date of birth.
[compat]
ADDRESS = "LOCATION"
DATE = "DOB"

# --- The categories the model card's scoring covers -------------------------------------------------
# The card scores seven type groups: person, email, phone, address, ID, secret and URL. This is this
# benchmark's reading of them (ID taken as every identifier category, URL as the network category). It
# only feeds the "card types" columns of the verdict, which are an approximation, not the card's scorer.
[card]
types = "PERSON,EMAIL,PHONE,ADDRESS,ID_NUMBER,ACCOUNT,FINANCIAL,SECRET,NETWORK"

# --- Gold spans the benchmark joins before scoring -------------------------------------------------
# Sources that cut one entity into parts (OpenPII: GIVENNAME + SURNAME, STREET + BUILDINGNUM) would
# make an exact-span match impossible against a model that reads the entity whole. Two spans of the
# same category join when at most two characters lie between them: spaces, tabs and hyphens, plus the
# extra characters listed here. Not applied to an "exhaustive" source (its spans are as authored).
[merge]
ADDRESS = ",."

# --- piikey EntityKind (as_str) -> category ------------------------------------------------------
# Every one of the 44 kinds must appear (the benchmark refuses to run otherwise). A category with no
# kind here is one piikey cannot produce at all ("no piikey counterpart").
[piikey]
secret = "SECRET"
url_credential = "SECRET"
email = "EMAIL"
iban = "FINANCIAL"
credit_card = "FINANCIAL"
ipv6 = "NETWORK"
mac = "NETWORK"
ipv4 = "NETWORK"
us_ssn = "ID_NUMBER"
nl_bsn = "ID_NUMBER"
phone = "PHONE"
person = "PERSON"
person_alias = "PERSON"
person_identifier = "ID_NUMBER"
person_attribute = "PERSON_ATTR"
person_role = "PERSON_ATTR"
date_of_birth = "DOB"
phone_number = "PHONE"
contact_handle = "ACCOUNT"
postal_address = "ADDRESS"
location = "LOCATION"
geo_location = "GEO"
device_identifier = "NETWORK"
identifying_link = "NETWORK"
account_identifier = "ACCOUNT"
auth_secret = "SECRET"
bank_account = "FINANCIAL"
payment_card = "FINANCIAL"
card_security = "FINANCIAL"
financial_amount = "AMOUNT"
document_identifier = "ID_NUMBER"
document_reference = "OTHER"
vehicle_identifier = "ID_NUMBER"
organization_name = "ORG"
organization_identifier = "ID_NUMBER"
proper_name = "OTHER"
health_data = "SENSITIVE"
biometric_data = "SENSITIVE"
ethnic_origin = "SENSITIVE"
political_opinion = "SENSITIVE"
religion_or_belief = "SENSITIVE"
sexual_orientation = "SENSITIVE"
trade_union = "SENSITIVE"
criminal_offence = "SENSITIVE"

