name: release-assets

# Builds the portable zip, the per-user installer and SHA256SUMS.txt from source, tests them, and
# uploads them to a release. From the same build it also packs the MSIX package for the Microsoft
# Store and installs a signed copy on the runner to test it; the unsigned MSIX is a workflow
# artifact, never a release asset. release.yml calls it right after release-plz tags a release (a
# tag made with GITHUB_TOKEN starts no other workflow). By hand:
#   gh workflow run release-assets.yml --ref main            dry run: build and test, upload nothing
#   gh workflow run release-assets.yml -f tag=v0.1.0         rebuild a release's assets and replace them
on:
  workflow_call:
    inputs:
      tag:
        description: Existing release tag to build and upload; empty = dry run from the calling ref
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and upload; empty = dry run from the selected ref
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.sha }}
          persist-credentials: false
      # rust-toolchain.toml selects the version; rustup installs it on first use.
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-about
      - name: Install Inno Setup
        # The runner image has it (6.7.1 on windows-2025); this is only a fallback, pinned.
        run: |
          if (!(Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --version 6.7.1 --no-progress -y
          }
      - name: Read the version
        id: version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          $v = (cargo metadata --format-version 1 --no-deps | ConvertFrom-Json).packages |
            Where-Object name -eq 'piikey-app' |
            ForEach-Object version
          if (-not $v) {
            throw 'cannot read the version of piikey-app from cargo metadata'
          }
          if ($env:TAG -and $env:TAG -ne "v$v") {
            throw "tag $env:TAG does not match Cargo version $v"
          }
          "version=$v" >> $env:GITHUB_OUTPUT
      - run: cargo build --release --workspace --locked
      - name: Package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./packaging/windows/package.ps1 -Version $env:VERSION -SkipMsix
      - name: Smoke test the zip, the installer and the uninstaller
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./packaging/windows/smoke.ps1 -Version $env:VERSION
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: piikey-${{ steps.version.outputs.version }}
          path: |
            dist/piikey-${{ steps.version.outputs.version }}-windows-x64.zip
            dist/piikey-${{ steps.version.outputs.version }}-setup-x64.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
      - name: Attest build provenance
        if: inputs.tag != ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/piikey-${{ steps.version.outputs.version }}-windows-x64.zip
            dist/piikey-${{ steps.version.outputs.version }}-setup-x64.exe
      - name: Upload to the release
        if: inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $files = "dist/piikey-$env:VERSION-windows-x64.zip", "dist/piikey-$env:VERSION-setup-x64.exe", 'dist/SHA256SUMS.txt'
          gh release upload $env:TAG @files --clobber --repo $env:GITHUB_REPOSITORY
      # The MSIX is for the Microsoft Store, not for the release: the three steps below come last, after
      # everything that goes to the release has been uploaded.
      - name: Package the MSIX
        id: msix
        # A broken Store package fails a dry run; a release run only marks the step, so the assets and winget go on.
        continue-on-error: ${{ inputs.tag != '' }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
          # Repository variables, from Partner Center (Product identity): all three or none.
          STORE_IDENTITY_NAME: ${{ vars.STORE_IDENTITY_NAME }}
          STORE_PUBLISHER: ${{ vars.STORE_PUBLISHER }}
          STORE_PUBLISHER_DISPLAY_NAME: ${{ vars.STORE_PUBLISHER_DISPLAY_NAME }}
        run: |
          $names = 'STORE_IDENTITY_NAME', 'STORE_PUBLISHER', 'STORE_PUBLISHER_DISPLAY_NAME'
          $set = @($names | Where-Object { -not [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_)) })
          $store = @{}
          if ($set.Count -eq $names.Count) {
            $store = @{
              IdentityName = $env:STORE_IDENTITY_NAME
              Publisher = $env:STORE_PUBLISHER
              PublisherDisplayName = $env:STORE_PUBLISHER_DISPLAY_NAME
            }
          }
          elseif ($set.Count -gt 0) {
            $empty = $names | Where-Object { $set -notcontains $_ }
            throw "set all three repository variables (STORE_IDENTITY_NAME, STORE_PUBLISHER, STORE_PUBLISHER_DISPLAY_NAME) or none; empty: $($empty -join ', ')"
          }
          ./packaging/windows/package-msix.ps1 -Version $env:VERSION @store
          $file = "piikey-$env:VERSION-x64.msix"
          if ($store.Count -gt 0) {
            "MSIX ${file}: Store identity $($store.IdentityName) by $($store.Publisher). This is the file for Partner Center." >> $env:GITHUB_STEP_SUMMARY
          }
          else {
            "MSIX ${file}: test identity. Set the repository variables STORE_IDENTITY_NAME, STORE_PUBLISHER and STORE_PUBLISHER_DISPLAY_NAME to build the Store package." >> $env:GITHUB_STEP_SUMMARY
          }
      - name: Smoke test the MSIX
        if: steps.msix.outcome == 'success'
        # As above: a broken Store package only fails a dry run.
        continue-on-error: ${{ inputs.tag != '' }}
        # Installs a package and starts the app: a hang must not hold up the winget submission for hours.
        timeout-minutes: 20
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./packaging/windows/smoke-msix.ps1 -Version $env:VERSION
      # Unsigned, as the Store signs it: when the STORE_* variables are set, this is the file to upload to
      # Partner Center. It is kept when the smoke test failed, to look at.
      - name: Upload the MSIX
        if: ${{ !cancelled() && steps.msix.outcome == 'success' }}
        # As above: a failure here only fails a dry run.
        continue-on-error: ${{ inputs.tag != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: piikey-${{ steps.version.outputs.version }}-msix
          path: dist/piikey-${{ steps.version.outputs.version }}-x64.msix
          if-no-files-found: error
          retention-days: 14
