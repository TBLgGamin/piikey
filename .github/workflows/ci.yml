name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # piikey is Windows-only (DPAPI vault, Windows.Media.Ocr).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml selects the version; rustup installs it on first use.
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt-check
      - run: cargo lint
      - run: cargo test --all-targets -- --nocapture
