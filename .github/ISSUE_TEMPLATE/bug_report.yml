name: Bug report
description: Something does not work as expected
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: piikey version
      description: Shown on the Settings page of the app, or run `piikey-cli --version`.
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "Windows 11 24H2"
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - App
        - CLI
        - Proxy / a site or program
        - Installer
        - Other
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: logs
    attributes:
      label: Logs or output
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed or replaced all real personal data in this report
          required: true
